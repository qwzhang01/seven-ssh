<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180"
        fill="none" stroke="#313244" stroke-width="4"/>

  <!-- Terminal prompt: >_ -->
  <text x="512" y="580" font-family="SF Mono, Menlo, Monaco, Consolas, monospace"
        font-size="420" font-weight="700" text-anchor="middle" fill="#89b4fa">
    &gt;_
  </text>

  <!-- Subtle glow effect -->
  <text x="512" y="580" font-family="SF Mono, Menlo, Monaco, Consolas, monospace"
        font-size="420" font-weight="700" text-anchor="middle"
        fill="#89b4fa" opacity="0.3" filter="blur(8px)">
    &gt;_
  </text>
</svg>
